services:
  backend:
    build:
      context: ./backend
    image: devcommunity-backend:1.0.0
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      SWAGGER_ENABLED: "true"
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    image: devcommunity-frontend:1.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped